[build]
  command = "npm run generate"
  # Netlify auto-detects Nuxt and swaps in its own "netlify-static" Nitro
  # preset for it, which outputs to dist/ -- NOT .output/public (that's only
  # what plain `nuxt generate` produces outside Netlify's build environment,
  # confirmed via a local test run before this preset-switch was known).
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Nitro's static preset (ssr: false) generates a dedicated 200.html as the SPA
# fallback for hosts like this one -- serve it for any route the static build
# didn't prerender (e.g. dynamic ids like /trivia/game/<id>), letting Vue
# Router take over client-side.
[[redirects]]
  from = "/*"
  to = "/200.html"
  status = 200
